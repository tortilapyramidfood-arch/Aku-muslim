<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Islamic 8-point geometric rosette background pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="180" />
    <circle cx="256" cy="256" r="140" />
    <rect x="116" y="116" width="280" height="280" rx="30" transform="rotate(0 256 256)" />
    <rect x="116" y="116" width="280" height="280" rx="30" transform="rotate(45 256 256)" />
  </g>

  <!-- Golden Crescent Moon (Bulan Sabit) -->
  <path d="M 330 110
           C 210 110 120 200 120 320
           C 120 400 165 460 230 490
           C 160 450 140 370 160 290
           C 180 210 250 150 340 140
           C 365 137 390 142 410 150
           C 385 125 358 110 330 110 Z"
        fill="url(#goldGrad)"
        filter="url(#subtleShadow)" />

  <!-- Open Quran / Mushaf Terbuka -->
  <!-- Left Page -->
  <path d="M 256 310
           C 220 285 170 280 135 295
           C 130 297 125 303 125 310
           L 125 405
           C 125 412 130 418 136 416
           C 175 400 220 405 256 430
           Z"
        fill="url(#pageGrad)"
        filter="url(#subtleShadow)" />

  <!-- Right Page -->
  <path d="M 256 310
           C 292 285 342 280 377 295
           C 382 297 387 303 387 310
           L 387 405
           C 387 412 382 418 376 416
           C 337 400 292 405 256 430
           Z"
        fill="url(#pageGrad)"
        filter="url(#subtleShadow)" />

  <!-- Quran Spine & Stand (Rehal) accent in Gold -->
  <path d="M 252 308 L 260 308 L 260 435 L 252 435 Z" fill="#d97706" />
  
  <!-- Subtle Quran Lines on Pages -->
  <path d="M 150 325 Q 185 315 235 330" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 150 345 Q 185 335 235 350" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 150 365 Q 185 355 235 370" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none" />
  
  <path d="M 277 330 Q 327 315 362 325" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 277 350 Q 327 335 362 345" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 277 370 Q 327 355 362 365" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Rehal / Wooden Stand -->
  <path d="M 200 425 L 170 455 C 166 459 170 465 176 465 L 336 465 C 342 465 346 459 342 455 L 312 425 Z"
        fill="#92400e" opacity="0.9" />

  <!-- Radiant Star above Crescent -->
  <path d="M 330 165 
           L 334 178 L 347 182 L 334 186 L 330 199 
           L 326 186 L 313 182 L 326 178 Z" 
        fill="#fbbf24" />
</svg>
