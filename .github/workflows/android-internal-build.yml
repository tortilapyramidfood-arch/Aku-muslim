name: AKU MUSLIM - Android Internal Beta Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-internal-apk:
    name: Build Debug APK (Internal Testing Only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Automated Quality Gate Tests (100 Checks)
        run: npm test

      - name: Build Web Application Bundle (Vite)
        run: npm run build

      - name: Sync Web Assets to Android via Capacitor
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew || true

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Internal Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aku-muslim-staging-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
